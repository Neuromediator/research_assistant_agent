[project]
name = "research_assistant_agent"
version = "0.1.0"
description = "Web research agent that produces cited markdown reports — built with CrewAI"
authors = [{ name = "Sergei Maslennikov", email = "sergeimaslennikov89@gmail.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.14.4",
    "trafilatura>=2.0",
    "gradio>=5.0",
    "langfuse>=2.0",
    "python-dotenv>=1.0",
    "requests>=2.32",
]

[project.scripts]
research_assistant_agent = "research_assistant_agent.main:run"
run_crew = "research_assistant_agent.main:run"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
